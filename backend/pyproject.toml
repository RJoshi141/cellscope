[project]
name = "cellscope"
version = "0.1.0"
description = "Battery health monitor API: Flask + SQLAlchemy with a simulated SMBus layer"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-cors>=4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
